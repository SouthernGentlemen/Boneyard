name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Verify pinned toolchain
        shell: bash
        run: |
          expected_node="$(cat .node-version)"
          expected_npm="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          test "$(node --version)" = "v${expected_node}"
          test "$(npm --version)" = "${expected_npm}"
          node --version
          npm --version

      - name: Install Blender
        shell: bash
        env:
          BLENDER_VERSION: 4.5.14
        run: |
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          release_root="https://download.blender.org/release/Blender4.5"
          checksum_file="${RUNNER_TEMP}/blender-${BLENDER_VERSION}.sha256"
          archive_path="${RUNNER_TEMP}/${archive}"
          selected_checksum="${RUNNER_TEMP}/blender-linux.sha256"

          curl --fail --location --retry 3 --retry-all-errors --silent --show-error             --output "${archive_path}" "${release_root}/${archive}"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error             --output "${checksum_file}" "${release_root}/blender-${BLENDER_VERSION}.sha256"

          awk -v archive="${archive}" '$2 == archive || $2 == "*" archive { print }'             "${checksum_file}" > "${selected_checksum}"
          test "$(wc -l < "${selected_checksum}")" -eq 1
          (
            cd "${RUNNER_TEMP}"
            sha256sum --check "$(basename "${selected_checksum}")"
          )

          tar --extract --xz --file="${archive_path}" --directory="${RUNNER_TEMP}"
          blender="${RUNNER_TEMP}/blender-${BLENDER_VERSION}-linux-x64/blender"
          test -x "${blender}"
          echo "SVGLAB_BLENDER=${blender}" >> "${GITHUB_ENV}"
          "${blender}" --version | head -n 1

      - name: Install locked dependencies
        run: npm ci

      - name: Run canonical acceptance
        env:
          SVGLAB_REQUIRE_BLENDER: "1"
        run: npm run check
